name: fnOS FPK

# 只在打包工程发生变化时跑，避免上游 C 代码的日常提交触发整个构建。
on:
  push:
    branches: [ fnos, main, master ]
    paths:
      - 'fnos/**'
      - '.github/workflows/fnos-fpk.yml'
    tags: [ 'v*' ]
  pull_request:
    paths:
      - 'fnos/**'
      - '.github/workflows/fnos-fpk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------- 快速检查
  tests:
    name: 单元测试 + 端到端 API 测试
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Python 语法检查
        run: python3 -m compileall -q fnos/app/server

      - name: 单元测试（配置校验 / XML / 日志轮转）
        run: python3 -m unittest discover -s fnos/tests -v

      - name: 端到端 API 测试（真起服务 + 假桥接进程，19 个用例）
        run: python3 fnos/tests/test_service.py

      - name: 日志轮转 shell 断言（从 cmd/main 提取真实函数）
        run: ./fnos/tools/test-logrotate.sh

      - name: Shell 语法检查
        run: |
          for f in fnos/cmd/* fnos/scripts/*.sh fnos/tools/*.sh; do
            bash -n "$f" || exit 1
          done

      - name: JSON 元数据可解析 + manifest 关键字段
        run: |
          python3 - <<'PY'
          import json, re, pathlib
          for name in ("config/privilege", "config/resource", "app/ui/config",
                       "wizard/install", "wizard/config", "wizard/uninstall"):
              json.load(open(f"fnos/{name}", encoding="utf-8"))
              print("OK", name)
          text = pathlib.Path("fnos/manifest").read_text(encoding="utf-8")
          for field in ("appname", "version", "platform", "source", "service_port",
                        "desktop_uidir", "desktop_applaunchname"):
              assert re.search(rf"^{field}\s*=", text, re.M), f"manifest 缺字段 {field}"
          # 官方不存在的字段名一律不能用
          for bad in ("arch", "description", "developer", "category", "port"):
              assert not re.search(rf"^{bad}\s*=", text, re.M), f"manifest 含非法字段 {bad}"
          ver = re.search(r"^version\s*=\s*(\S+)", text, re.M).group(1)
          assert re.fullmatch(r"\d+(\.\d+){2}(-\d+)?", ver), f"version 不合法：{ver}"
          print("manifest OK", ver)
          PY

      - name: 隐私清理（应用包内不得出现内网地址 / 本机用户名）
        run: |
          if grep -rnE '192\.168\.[0-9]+\.[0-9]+|10\.[0-9]+\.[0-9]+\.[0-9]+' fnos/ \
               --include='*.py' --include='*.sh' --include='*.json' --include='*.js' \
               --include='*.html' --include='*.css' --include='*.md' --include='manifest' \
               | grep -v '0\.0\.0\.0'; then
            echo "::error::打包工程里出现了内网地址"; exit 1
          fi
          echo "无内网地址残留"

  # ---------------------------------------------------------------- 编译 + 打包
  build:
    name: 编译 airupnp / aircast 并打包 fpk
    needs: tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装构建依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential

      - name: 从上游源码编译并打包（build.sh 会自己初始化 git 子模块）
        run: ./fnos/scripts/build.sh

      - name: 记录产物校验值
        run: |
          FPK=$(ls fnos/dist/*.fpk)
          sha256sum "$FPK" | tee fnos/dist/SHA256SUMS.txt

      - name: 校验 fpk 双层结构
        run: |
          FPK=$(ls fnos/dist/*.fpk)
          # 列表先落文件再 grep：`tar tzf | grep -q` 里 grep 命中即退出，tar 会因
          # SIGPIPE 打出 "tar: stdout: write error"，虽然不影响结果但看着像故障。
          tar tzf "$FPK" > /tmp/fpk-outer.txt
          tar xzOf "$FPK" app.tgz | tar tzf - > /tmp/fpk-inner.txt
          echo "--- 外层 ---"; cat /tmp/fpk-outer.txt
          echo "--- app.tgz ---"; cat /tmp/fpk-inner.txt
          for entry in manifest cmd/main config/privilege config/resource \
                       wizard/install ICON.PNG ICON_256.PNG app.tgz; do
            grep -qx "$entry" /tmp/fpk-outer.txt || { echo "::error::fpk 缺少 $entry"; exit 1; }
          done
          for entry in bin/airupnp bin/aircast server/main.py ui/index.html ui/config ui/css/app.css; do
            grep -qx "$entry" /tmp/fpk-inner.txt || { echo "::error::app.tgz 缺少 $entry"; exit 1; }
          done
          # 生命周期脚本必须带执行位，否则安装直接失败
          tar tzvf "$FPK" > /tmp/fpk-verbose.txt
          if awk '/cmd\// && $1 !~ /^-rwx/ {print "::error::" $NF " 缺执行位"; bad=1} END{exit bad}' /tmp/fpk-verbose.txt; then
            echo "cmd/* 执行位正常"
          else
            exit 1
          fi

      - name: 模拟安装 → 启动 → 配置变更 → 停止 → 卸载
        run: |
          sudo -E env "AIRCONNECT_SIM_ROOT=/tmp/fpk-sim" "AIRCONNECT_SIM_PORT=18999" \
            ./fnos/tools/simulate-install.sh "$(ls fnos/dist/*.fpk)"

      - name: 上传 fpk
        uses: actions/upload-artifact@v4
        with:
          name: airconnect-fpk
          path: |
            fnos/dist/*.fpk
            fnos/dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: 打 tag 时发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          FPK=$(ls fnos/dist/*.fpk)
          TAG="${GITHUB_REF_NAME}"
          REPO="${GITHUB_REPOSITORY}"
          NAME=$(basename "$FPK")
          API="https://api.github.com/repos/${REPO}"

          # 定位（必要时创建）Release，拿到**数字 ID**。
          # ⚠️ 上传资产必须用 /releases/<id>/assets；用 /releases/tags/<tag>/assets
          # 会被 GitHub 拒绝："Multipart form data required"，而且那个错误
          # 只要不检查响应就会被当成成功（本仓库真实踩过）。
          RID=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" "${API}/releases/tags/${TAG}" \
                | python3 -c 'import json,sys
          try: print(json.load(sys.stdin).get("id","") or "")
          except Exception: print("")')
          if [ -z "$RID" ]; then
            BODY=$(jq -n --arg tag "$TAG" --arg name "$NAME" \
                        --arg size "$(stat -c %s "$FPK")" \
                        --arg sha "$(sha256sum "$FPK" | cut -d' ' -f1)" \
              '{tag_name:$tag, name:("AirConnect for fnOS " + $tag), draft:false, prerelease:false,
                body:($name + "\n\n- 体积: " + $size + " 字节\n- SHA-256: `" + $sha + "`")}')
            RID=$(curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" \
                  -H "Accept: application/vnd.github+json" -H "Content-Type: application/json" \
                  "${API}/releases" -d "$BODY" \
                  | python3 -c 'import json,sys
          d=json.load(sys.stdin)
          print(d.get("id","") or d.get("message",""))')
          fi
          case "$RID" in
            ''|*[!0-9]*) echo "::error::无法创建/定位 Release：$RID"; exit 1 ;;
          esac
          echo "Release ID = $RID"

          upload() {
            curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$FPK" \
              "https://uploads.github.com/repos/${REPO}/releases/${RID}/assets?name=$1"
          }

          # ★ 顺序很重要：**先上传、成功了再清理同名旧资产**。
          # 反过来（先删后传）一旦上传失败，资产就彻底没了 —— 本仓库 1.12.4-1
          # 和 1.12.4-2 两个 Release 的资产就是这样被抹掉的。
          RESP=$(upload "$NAME")
          if ! echo "$RESP" | grep -q '"browser_download_url"'; then
            echo "首次上传未成功（多半是同名资产已存在），先清理再重试：$RESP"
            curl -sS -H "Authorization: Bearer $GH_TOKEN" "${API}/releases/${RID}/assets" \
              | python3 -c '
          import json, sys
          name = sys.argv[1]
          for a in json.load(sys.stdin):
              if a["name"] == name:
                  print(a["id"])
          ' "$NAME" | while read -r AID; do
                [ -n "$AID" ] && curl -sS -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
                  "${API}/releases/assets/${AID}" >/dev/null && echo "已删除旧资产 id=$AID"
              done
            RESP=$(upload "$NAME")
          fi

          if echo "$RESP" | grep -q '"browser_download_url"'; then
            echo "上传成功：$(echo "$RESP" | python3 -c 'import json,sys;print(json.load(sys.stdin)["browser_download_url"])')"
          else
            echo "::error::Release 资产上传失败：$RESP"
            exit 1
          fi

          # ★ 上传之后必须把正文里的体积/SHA-256 改成**实际发布出去的那份**。
          # CI 会覆盖同 tag 下已存在的资产（本地手动传的那份），如果正文还写着
          # 本地包的校验值，用户按 sha256 一验就会以为文件损坏 —— 本仓库踩过。
          ACTUAL_SIZE=$(echo "$RESP" | python3 -c 'import json,sys;print(json.load(sys.stdin)["size"])')
          ACTUAL_SHA=$(sha256sum "$FPK" | cut -d' ' -f1)
          BODY=$(jq -n --arg name "$NAME" --arg size "$ACTUAL_SIZE" --arg sha "$ACTUAL_SHA" \
            '($name + "\n\n- 体积: " + $size + " 字节\n- SHA-256: `" + $sha + "`")')
          curl -sS -X PATCH -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" -H "Content-Type: application/json" \
            "${API}/releases/${RID}" -d "$(jq -n --arg b "$BODY" '{body:$b}')" >/dev/null
          echo "Release 正文已同步为资产实际值：${ACTUAL_SIZE} 字节 / ${ACTUAL_SHA}"

          # 收尾自检：直链必须真的能下到东西（CI 里"上传成功"但直链 404 踩过）
          URL="https://github.com/${REPO}/releases/download/${TAG}/${NAME}"
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' -L "$URL" || true)
          if [ "$CODE" = "200" ]; then
            echo "直链校验通过：$URL"
          else
            echo "::error::直链校验失败（HTTP $CODE）：$URL"
            exit 1
          fi
